<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBD - Financeiro</title>
    <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@1.*/css/pico.min.css">
    <style>
        .card-financeiro h3 {
            color: #333333;
        }
        .label-dark {
            color: #333333;
        }
        .entrada { color: #2e7d32; font-weight: bold; }
        .saida { color: #c62828; font-weight: bold; }
        .grid-forms {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 10px;
            align-items: end;
        }
        @media (max-width: 768px) {
            .grid-forms { grid-template-columns: 1fr; }
        }
        .card-form {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 1px solid #ddd;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #f1f1f1; color: #333333 }
        .btn-voltar {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background-color: #666;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-voltar">⬅ Voltar para Chamada</a>

    <h1>💰 Painel Financeiro</h1>

    <div class="card-form" id="form-admin" style="display:none;">
        <h3 class="label-dark">Novo Lançamento Avulso</h3>
        <form id="form-lancamento">
            <div class="grid-forms">
                <div>
                    <label class="label-dark">Valor (R$)</label>
                    <input type="number" step="0.01" id="input-valor" placeholder="0,00" required>
                </div>
                <div>
                    <label class="label-dark">Tipo</label>
                    <select id="input-tipo" required>
                        <option value="entrada">Entrada (+)</option>
                        <option value="saida">Saída (-)</option>
                    </select>
                </div>
                <div>
                    <label class="label-dark">Descrição</label>
                    <input type="text" id="input-descricao" placeholder="Ex: Compra de café" required>
                </div>
                <div>
                    <label class="label-dark">Data</label>
                    <input type="date" id="input-data" required>
                </div>
                <button type="submit" style="margin-top: 10px;">Salvar</button>
            </div>
        </form>
    </div>

    <h3>Lançamentos Avulsos</h3>
    <div style="margin-bottom: 12px;">
        <label for="filtro-trimestre" style="margin-right: 8px; color: white;">Trimestre:</label>
        <select id="filtro-trimestre" style="width: auto; display: inline-block;" onchange="renderLancamentos()">
        </select>
    </div>
    <table style="margin-bottom: 40px;">
        <thead>
        <tr>
            <th>Data</th>
            <th>Descrição</th>
            <th>Tipo</th>
            <th>Valor</th>
            <th class="col-admin" style="display:none;">Ações</th>
        </tr>
        </thead>
        <tbody id="tabela-lancamentos">
        <tr><td colspan="5">Carregando lançamentos...</td></tr>
        </tbody>
    </table>

    <h3>Histórico por Trimestre</h3>
    <table>
        <thead>
        <tr>
            <th>Trimestre/Ano</th>
            <th>Ofertas Aulas</th>
            <th>Entradas Avulsas</th>
            <th>Total Entradas</th>
            <th>Saídas</th>
            <th>Saldo Final</th>
        </tr>
        </thead>
        <tbody id="tabela-meses">
        <tr><td colspan="4">Carregando dados...</td></tr>
        </tbody>
    </table>
</div>

<script src="common.js?v=1.0"></script>

<script>

    // Inicia a verificação ao abrir a página
    verificarAcesso();

    // Mostrar campos de admin se logado
    if (localStorage.getItem('adm_logado') === 'sim') {
        document.getElementById('form-admin').style.display = 'block';
        document.querySelectorAll('.col-admin').forEach(el => el.style.display = '');
    }

    // Setar data de hoje no input
    document.getElementById('input-data').value = new Date().toISOString().split('T')[0];

    const nomesTrimestres = { 1: 'Jan-Mar', 2: 'Abr-Jun', 3: 'Jul-Set', 4: 'Out-Dez' };
    let todosLancamentos = [];

    function periodoDoLancamento(item) {
        const partes = item.data_formatada.split('/'); // DD/MM/YYYY
        const mes = parseInt(partes[1]);
        const ano = partes[2];
        const tri = Math.ceil(mes / 3);
        return `${nomesTrimestres[tri]}/${ano}`;
    }

    function periodoAtual() {
        const agora = new Date();
        const tri = Math.ceil((agora.getMonth() + 1) / 3);
        return `${nomesTrimestres[tri]}/${agora.getFullYear()}`;
    }

    function renderLancamentos() {
        const filtro = document.getElementById('filtro-trimestre').value;
        const lista = todosLancamentos.filter(i => periodoDoLancamento(i) === filtro);
        const tbody = document.getElementById('tabela-lancamentos');
        tbody.innerHTML = '';
        const isAdmin = localStorage.getItem('adm_logado') === 'sim';

        if (lista.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5">Nenhum lançamento avulso.</td></tr>';
            return;
        }
        lista.forEach(item => {
            const tr = document.createElement('tr');
            const valorFormatado = item.valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            tr.innerHTML = `
                <td>${item.data_formatada}</td>
                <td>${item.descricao}</td>
                <td class="${item.tipo}">${item.tipo.toUpperCase()}</td>
                <td class="${item.tipo}">${valorFormatado}</td>
                <td class="col-admin" style="${isAdmin ? '' : 'display:none;'}">
                    <button class="outline" style="padding: 5px 10px; font-size: 0.8em; margin-right: 4px;" onclick="editarValor('${item.id}', ${item.valor})">Editar valor</button>
                    <button class="outline contrast" style="padding: 5px 10px; font-size: 0.8em;" onclick="excluirLancamento('${item.id}')">Excluir</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function carregarFinanceiro() {
        try {
            const res = await fetch(`${API_URL}/financeiro/resumo`);
            const dados = await res.json();

            // Tabela Trimestre
            const tbodyMeses = document.getElementById('tabela-meses');
            tbodyMeses.innerHTML = '';

            if (dados.historico.length === 0) {
                tbodyMeses.innerHTML = '<tr><td colspan="6">Nenhuma oferta registrada.</td></tr>';
            } else {
                const triOrdem = { 'Jan-Mar': 1, 'Abr-Jun': 2, 'Jul-Set': 3, 'Out-Dez': 4 };
                dados.historico.sort((a, b) => {
                    const [nA, anoA] = a.periodo.split('/');
                    const [nB, anoB] = b.periodo.split('/');
                    if (anoB !== anoA) return parseInt(anoB) - parseInt(anoA);
                    return triOrdem[nB] - triOrdem[nA];
                });
                dados.historico.forEach(item => {
                    const tr = document.createElement('tr');
                    const entradasAulasFmt = item.entradas_aulas.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    const entradasAvulsasFmt = item.entradas_avulsas.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    const totalEntradasFmt = (item.entradas_aulas + item.entradas_avulsas).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    const saidasFmt = item.saidas.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    const saldoFmt = item.total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

                    const corSaldo = item.total >= 0 ? '#2e7d32' : '#c62828';

                    tr.innerHTML = `
                        <td>${item.periodo}</td>
                        <td style="color: #2e7d32;">${entradasAulasFmt}</td>
                        <td style="color: #2e7d32;">${entradasAvulsasFmt}</td>
                        <td style="color: #2e7d32; font-weight:bold;">${totalEntradasFmt}</td>
                        <td style="color: #c62828;">${saidasFmt}</td>
                        <td style="font-weight:bold; color: ${corSaldo};">${saldoFmt}</td>
                    `;
                    tbodyMeses.appendChild(tr);
                });
            }

            // Popula filtro de trimestre com períodos presentes nos lançamentos
            todosLancamentos = dados.lancamentos;
            const periodos = [...new Set(todosLancamentos.map(periodoDoLancamento))];
            const sel = document.getElementById('filtro-trimestre');
            const valorAtual = sel.value || periodoAtual();
            sel.innerHTML = '';
            periodos.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                opt.textContent = p;
                if (p === valorAtual) opt.selected = true;
                sel.appendChild(opt);
            });

            renderLancamentos();

        } catch (erro) {
            console.error(erro);
            alert('Erro ao carregar dados financeiros.');
        }
    }

    async function editarValor(id, valorAtual) {
        const novoValor = prompt('Novo valor (R$):', valorAtual.toFixed(2).replace('.', ','));
        if (novoValor === null) return;
        const valorNum = parseFloat(novoValor.replace(',', '.'));
        if (isNaN(valorNum) || valorNum <= 0) {
            alert('Valor inválido.');
            return;
        }
        try {
            const res = await fetch(`${API_URL}/financeiro/lancamentos/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ valor: valorNum })
            });
            if (res.ok) {
                carregarFinanceiro();
            } else {
                alert('Erro ao atualizar valor.');
            }
        } catch (e) {
            alert('Erro na conexão.');
        }
    }

    async function excluirLancamento(id) {
        if (!confirm('Deseja excluir este lançamento?')) return;
        try {
            const res = await fetch(`${API_URL}/financeiro/lancamentos/${id}`, { method: 'DELETE' });
            if (res.ok) {
                carregarFinanceiro();
            }
        } catch (e) {
            alert('Erro ao excluir');
        }
    }

    document.getElementById('form-lancamento').addEventListener('submit', async (e) => {
        e.preventDefault();
        const dados = {
            valor: document.getElementById('input-valor').value,
            tipo: document.getElementById('input-tipo').value,
            descricao: document.getElementById('input-descricao').value,
            data: document.getElementById('input-data').value
        };

        try {
            const res = await fetch(`${API_URL}/financeiro/lancamentos`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (res.ok) {
                document.getElementById('form-lancamento').reset();
                document.getElementById('input-data').value = new Date().toISOString().split('T')[0];
                carregarFinanceiro();
            } else {
                alert('Erro ao salvar lançamento');
            }
        } catch (error) {
            console.error(error);
            alert('Erro na conexão');
        }
    });

    carregarFinanceiro();
</script>
